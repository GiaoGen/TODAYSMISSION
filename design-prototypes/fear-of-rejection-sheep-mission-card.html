<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fear of Rejection — One Small Ask</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f3eee6;
      --coral: #ef9274;
      --ink: #202943;
      --cream: #fff0ce;
      --mint: #a9d9c8;
      --yellow: #f4ce58;
      --face: #5d514d;
      --white: #fffaf0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      position: relative;
      width: min(84vw, 420px);
      aspect-ratio: 2 / 3;
      overflow: hidden;
      border: 3px solid var(--ink);
      border-radius: 28px;
      background: var(--coral);
      color: var(--cream);
    }

    .background,
    .sheep {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .sheep {
      z-index: 1;
      display: block;
      object-fit: cover;
      pointer-events: none;
    }

    .copy {
      position: relative;
      z-index: 2;
      width: 74%;
      padding: 9% 0 0 9%;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: .55rem;
      margin: 0 0 1.1rem;
      color: var(--yellow);
      font-size: clamp(.63rem, 2.2vw, .76rem);
      font-weight: 800;
      letter-spacing: .14em;
      line-height: 1;
      text-transform: uppercase;
    }

    .number {
      display: grid;
      width: 2.1rem;
      aspect-ratio: 1;
      place-items: center;
      border: 2px solid currentColor;
      border-radius: 50%;
      letter-spacing: 0;
    }

    h1 {
      max-width: 8ch;
      margin: 0;
      font-size: clamp(2.5rem, 11vw, 4rem);
      font-weight: 850;
      letter-spacing: -.065em;
      line-height: .82;
      text-wrap: balance;
    }

    .mission {
      width: 85%;
      margin: 1.35rem 0 0;
      color: var(--white);
      font-size: clamp(.82rem, 3.2vw, 1rem);
      font-weight: 540;
      letter-spacing: -.015em;
      line-height: 1.42;
    }

    @media (max-width: 420px) {
      body { padding: 18px; }
      .card { width: min(90vw, 390px); border-radius: 24px; }
      .copy { width: 76%; }
      .eyebrow { margin-bottom: .85rem; }
      .number { width: 1.8rem; }
      .mission { margin-top: 1rem; }
    }
  </style>
</head>
<body>
  <article class="card" aria-labelledby="mission-title">
    <svg class="background" viewBox="0 0 600 900" aria-hidden="true">
      <rect width="600" height="900" fill="#ef9274"/>
      <path d="M0 0H466V570C397 615 315 638 220 638C136 638 63 618 0 579Z" fill="#202943"/>
      <circle cx="512" cy="636" r="244" fill="#a9d9c8"/>
      <circle cx="520" cy="112" r="34" fill="#f4ce58"/>
      <rect x="492" y="160" width="56" height="10" rx="5" fill="#202943"/>
      <rect x="514" y="138" width="10" height="56" rx="5" fill="#202943"/>
      <path d="M0 760H205C239 760 267 788 267 822V900H0Z" fill="#f4ce58"/>
      <circle cx="51" cy="704" r="10" fill="#fff0ce"/>
      <circle cx="86" cy="704" r="10" fill="#fff0ce"/>
      <circle cx="121" cy="704" r="10" fill="#fff0ce"/>
    </svg>

    <div class="copy">
      <p class="eyebrow"><span class="number">01</span> Fear of Rejection</p>
      <h1 id="mission-title">One Small Ask</h1>
      <p class="mission">Ask an appropriate person for one small, specific, optional thing that would genuinely make your day easier. Make it easy for them to answer yes or no.</p>
    </div>

    <img
      class="sheep"
      src="../docs/design/mission-card-character-templates/sheep/concepts/01-peek-from-right.png"
      alt="A curious sheep peeking in from the right"
    >
  </article>
</body>
</html>
