<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fear of Rejection — Mission Card Study</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(24px, 5vw, 72px);
      background: #f1eee8;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 360px));
      gap: clamp(24px, 3vw, 48px);
      width: min(100%, 1152px);
    }

    .card {
      container-type: inline-size;
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      border-radius: clamp(16px, 1.5vw, 24px);
      color: var(--ink);
    }

    .card--one {
      --ink: #352b3b;
      background: #d98d86;
    }

    .card--two {
      --ink: #263a34;
      background: #dfbd61;
    }

    .card--three {
      --ink: #182d43;
      background: #78a5bd;
    }

    .character {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
    }

    .brand,
    .pack {
      position: absolute;
      z-index: 3;
      top: 6.5cqw;
      margin: 0;
      font-family: "Aptos", "Helvetica Neue", Arial, sans-serif;
      font-size: 2.75cqw;
      font-weight: 750;
      line-height: 1;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand { left: 7cqw; }

    .pack {
      right: 7cqw;
      max-width: 31cqw;
      text-align: right;
    }

    .title {
      position: absolute;
      z-index: 2;
      margin: 0;
      font-family: "Aptos Display", "Helvetica Neue", Arial, sans-serif;
      font-weight: 850;
      line-height: .84;
      letter-spacing: -.062em;
      text-transform: uppercase;
    }

    .title span { display: block; }

    .card--one .title {
      top: 22cqw;
      left: 7cqw;
      width: 58cqw;
      font-size: 15.7cqw;
    }

    .card--two .title {
      top: 21cqw;
      left: 7cqw;
      width: 87cqw;
      font-size: 11.8cqw;
      line-height: .88;
    }

    .card--three .title {
      top: 21cqw;
      left: 7cqw;
      width: 62cqw;
      font-size: 13.5cqw;
      line-height: .86;
    }

    @media (max-width: 900px) {
      .cards {
        grid-template-columns: minmax(0, 390px);
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <main class="cards" aria-label="Fear of Rejection Mission card studies">
    <article class="card card--one" aria-labelledby="mission-one">
      <p class="brand">TODAYSMISSION</p>
      <p class="pack">Fear of Rejection</p>
      <h1 class="title" id="mission-one">
        <span>One</span>
        <span>Small</span>
        <span>Ask</span>
      </h1>
      <img
        class="character"
        src="../docs/design/mission-card-character-templates/sheep/concepts/01-peek-from-right.png"
        alt=""
      >
    </article>

    <article class="card card--two" aria-labelledby="mission-two">
      <p class="brand">TODAYSMISSION</p>
      <p class="pack">Fear of Rejection</p>
      <h1 class="title" id="mission-two">
        <span>Put Your</span>
        <span>Preference</span>
        <span>On the</span>
        <span>Table</span>
      </h1>
      <img
        class="character"
        src="../docs/design/mission-card-character-templates/sheep/concepts/02-balance-run-single.png"
        alt=""
      >
    </article>

    <article class="card card--three" aria-labelledby="mission-three">
      <p class="brand">TODAYSMISSION</p>
      <p class="pack">Fear of Rejection</p>
      <h1 class="title" id="mission-three">
        <span>Ask Before</span>
        <span>You Are</span>
        <span>Stuck</span>
      </h1>
      <img
        class="character"
        src="../docs/design/mission-card-character-templates/sheep/concepts/03-comforting-pair.png"
        alt=""
      >
    </article>
  </main>
</body>
</html>
